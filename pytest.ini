# Code version: v1.1.1-codex.1
[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers -m "not live"
markers =
    integration: Flask integration tests that cross module boundaries.
    slow: Tests that take materially longer than the unit-test median.
    live: Manual tests that require an authenticated browser or remote service and never run in CI.
