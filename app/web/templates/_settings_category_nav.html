<nav class="settings-category-nav" aria-label="Settings categories">
    <a
        href="{{ url_for('settings') }}#settings-browser"
        class="settings-category-nav-item settings-category-nav-item-browser{% if current_category == 'browser' %} is-active{% endif %}"
        data-settings-category="browser"
        {% if current_category == 'browser' %}aria-current="page"{% endif %}
    >
        <span class="settings-category-nav-icon-shell" aria-hidden="true">
            <span class="icon settings-category-nav-icon"></span>
        </span>
        <span class="settings-category-nav-label">Browser &amp; account</span>
    </a>
    <a
        href="{{ url_for('settings') }}#settings-downloads"
        class="settings-category-nav-item settings-category-nav-item-downloads{% if current_category == 'downloads' %} is-active{% endif %}"
        data-settings-category="downloads"
        {% if current_category == 'downloads' %}aria-current="page"{% endif %}
    >
        <span class="settings-category-nav-icon-shell" aria-hidden="true">
            <span class="icon settings-category-nav-icon"></span>
        </span>
        <span class="settings-category-nav-label">Downloads</span>
    </a>
    <a
        href="{{ url_for('settings') }}#settings-llm"
        class="settings-category-nav-item settings-category-nav-item-llm{% if current_category == 'llm' %} is-active{% endif %}"
        data-settings-category="llm"
        {% if current_category == 'llm' %}aria-current="page"{% endif %}
    >
        <span class="settings-category-nav-icon-shell" aria-hidden="true">
            <span class="icon settings-category-nav-icon"></span>
        </span>
        <span class="settings-category-nav-label">LLM settings</span>
    </a>
    <a
        href="{{ url_for('settings') }}#settings-agent"
        class="settings-category-nav-item settings-category-nav-item-agent{% if current_category == 'agent' %} is-active{% endif %}"
        data-settings-category="agent"
        {% if current_category == 'agent' %}aria-current="page"{% endif %}

        <span class="settings-category-nav-icon-shell" aria-hidden="true">
            <span class="icon settings-category-nav-icon"></span>
        </span>
        <span class="settings-category-nav-label">Agent</span>
    </a>
    <a
        href="{{ url_for('settings') }}#settings-cloud"
        class="settings-category-nav-item settings-category-nav-item-cloud{% if current_category == 'cloud' %} is-active{% endif %}"
        data-settings-category="cloud"
        {% if current_category == 'cloud' %}aria-current="page"{% endif %}
    >
        <span class="settings-category-nav-icon-shell" aria-hidden="true">
            <span class="icon settings-category-nav-icon"></span>
        </span>
        <span class="settings-category-nav-label">Cloud backup</span>

        class="settings-category-nav-item settings-category-nav-item-style-tokens{% if current_category == 'style-tokens' %} is-active{% endif %}"

    >
        <span class="settings-category-nav-icon-shell" aria-hidden="true">
            <span class="icon settings-category-nav-icon"></span>
        </span>
        <span class="settings-category-nav-label">Style tokens</span>
    </a>
