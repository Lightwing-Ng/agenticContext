# Code version: v1.0.1-codex.0
name: Compute metadata native diagnosis
on:
  push:
    branches:
      - codex/compute-metadata-diagnostic-20261106
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install unchanged dependencies
        run: python -m pip install -r requirements.txt
      - name: Real rename boundary with unchanged source
        if: always()
        run: python scripts/diagnose_compute_metadata.py
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compute-metadata-native-baseline
          path: test-results/compute-metadata-diagnostic/
          if-no-files-found: error
