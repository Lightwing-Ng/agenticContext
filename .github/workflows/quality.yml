# Code version: v1.2.9-codex.1
name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python, JavaScript, and test checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/agenticcontext-playwright-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python -m playwright install --with-deps chromium

      - name: Verify browser discovery after test isolation
        run: |
          python - <<'PY'
          import tests.conftest
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runtime:
              executable = Path(runtime.chromium.executable_path)
              assert executable.is_file(), f"Isolated tests cannot find installed Chromium: {executable}"
              print(f"Isolated test Chromium: {executable}")
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run the quality gate
        run: AGENTIC_CONTEXT_PYTHON="$(command -v python)" ./scripts/check.sh

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: test-results/coverage.json
          if-no-files-found: warn

  check-windows:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      AGENTIC_CONTEXT_TEST_REPORT_FAILURES: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'agenticcontext-playwright-browsers'
          "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH" >> $env:GITHUB_ENV
          python -m playwright install chromium

      - name: Verify browser discovery after test isolation
        shell: pwsh
        run: |
          @'
          import tests.conftest
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runtime:
              executable = Path(runtime.chromium.executable_path)
              assert executable.is_file(), f"Isolated tests cannot find installed Chromium: {executable}"
              print(f"Isolated test Chromium: {executable}")
          '@ | python

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check native Windows boundaries before browser tests
        shell: pwsh
        run: |
          $env:AGENTIC_CONTEXT_PYTHON = (Get-Command python).Source
          $channelFailures = @()
          $env:DEBUG = 'pw:browser'
          foreach ($channel in @('chrome', 'msedge')) {
            $env:AGENTIC_CONTEXT_TEST_CHROMIUM_CHANNEL = $channel
            .\scripts\test.ps1 --tb=short --capture=no `
              tests/test_computer_use_agent.py::test_chatgpt_effort_slider_binding_requires_the_verified_menu_owner
            if ($LASTEXITCODE -ne 0) { $channelFailures += $channel }
          }
          Remove-Item Env:AGENTIC_CONTEXT_TEST_CHROMIUM_CHANNEL
          Remove-Item Env:DEBUG
          .\scripts\test.ps1 --tb=short --show-capture=no `
            tests/test_test_isolation.py `
            tests/test_agent_browser_cleanup.py `
            tests/test_compute_jobs.py `
            tests/test_compute_startup_races.py `
            tests/test_compute_json_io.py `
            tests/test_windows_compute_io.py `
            tests/test_windows_anchored_delete.py `
            tests/test_owner_only_permissions.py `
            tests/test_logging_setup.py `
            tests/test_static_asset_delivery.py `
            tests/test_agent_event_chain.py `
            tests/test_config.py `
            tests/test_config_and_state.py `
            tests/test_documentation.py `
            tests/test_downloader.py `
            tests/test_failure_reporter.py `
            tests/test_grok_storage.py `
            tests/test_local_media_browser.py `
            tests/test_resource_persistence.py `
            tests/test_web_app.py `
            "tests/test_sidebar_e2e.py::test_cache_overview_groups_unique_metrics_and_keeps_run_progress_current[dark-982]" `
            "tests/test_sidebar_e2e.py::test_resource_annotations_search_scope_toolbar_and_remark_bounds[390]" `
            tests/test_windows_workspace_fingerprint.py `
            tests/test_windows_entrypoints.py `
            tests/test_chromium_profile_boundaries.py `
            tests/test_computer_use_agent.py `
            tests/test_agent_controller_hardening.py `
            tests/test_agent_profile_binding.py `
            tests/test_agent_source_cache.py `
            tests/test_scraper_and_browser_sessions.py `
            tests/test_agent_session_pool.py
          $coreExitCode = $LASTEXITCODE
          if ($channelFailures.Count -gt 0) {
            Write-Error "Native installed-browser checks failed: $($channelFailures -join ', ')"
            exit 1
          }
          exit $coreExitCode

      - name: Run the quality gate
        shell: pwsh
        run: |
          $env:AGENTIC_CONTEXT_PYTHON = (Get-Command python).Source
          .\scripts\check.ps1

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-windows
          path: test-results/coverage.json
          if-no-files-found: warn
