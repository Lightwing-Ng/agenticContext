# Code version: v1.0.0-ci-probe.1
name: CI failure reproduction
on: push
permissions:
  contents: read
jobs:
  probe:
    name: Windows Python invocation proof
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install browser
        run: python -m playwright install chromium
      - name: Collect Windows failure details
        run: python -m pytest tests -q -m "not live" --tb=short --junitxml=test-results/windows-diagnostic.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-diagnostic
          path: test-results/windows-diagnostic.xml
