# Code version: v1.8.1-codex.0
name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-shards:
    name: Linux quality shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TZ: UTC
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../playwright-browsers
      AGENTIC_CONTEXT_TEST_SHARD: ${{ matrix.shard }}
      AGENTIC_CONTEXT_TEST_SHARD_COUNT: '8'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Prefer the canonical Ubuntu package mirror
        run: |
          # Slow Azure archive transfers can consume the unchanged job budget.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -E -i 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: python -m playwright install --with-deps chromium

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Run the quality gate
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: AGENTIC_CONTEXT_PYTHON="$(command -v python)" ./scripts/check.sh

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage-linux-attempt-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: test-results/quality-shard-${{ matrix.shard }}/
          if-no-files-found: error

  check-windows-shards:
    name: Windows quality shard ${{ matrix.shard }}/8
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TZ: UTC
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../playwright-browsers
      AGENTIC_CONTEXT_TEST_SHARD: ${{ matrix.shard }}
      AGENTIC_CONTEXT_TEST_SHARD_COUNT: '8'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: python -m playwright install chromium

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Verify the first Windows browser boundary
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        shell: pwsh
        run: |
          $env:AGENTIC_CONTEXT_PYTHON = (Get-Command python).Source
          & $env:AGENTIC_CONTEXT_PYTHON -m pytest -vv -x --tb=short -p no:cacheprovider `
            "tests/test_agent_activity_e2e.py::test_sidebar_icons_share_provider_axis_without_moving_dock"

      - name: Run the quality gate
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        shell: pwsh
        run: |
          $env:AGENTIC_CONTEXT_PYTHON = (Get-Command python).Source
          .\scripts\check.ps1

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage-windows-attempt-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: test-results/quality-shard-${{ matrix.shard }}/
          if-no-files-found: error

  check-python314:
    name: Python 3.14 codec and storage compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Require the native Zstandard backend
        run: python -c "import compression.zstd; import sys; assert sys.version_info >= (3, 14)"

      - name: Exercise codec dictionaries and storage migration
        run: |
          AGENTIC_CONTEXT_PYTHON="$(command -v python)" ./scripts/test.sh \
            tests/test_wechat_native_resource_extension.py \
            tests/test_llm_sqlite.py tests/test_migrate_llm_sqlite.py \
            --junitxml=test-results/python314.xml

      - name: Upload Python 3.14 results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python314-compatibility-attempt-${{ github.run_attempt }}
          path: test-results/python314.xml
          if-no-files-found: warn

  check-macos:
    name: macOS native boundaries and WebKit smoke
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../playwright-browsers

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Require native macOS POSIX support
        run: python -c "import compression.zstd; import fcntl; import sys; assert sys.platform == 'darwin'"

      - name: Exercise native filesystem, AppleScript, process, and lock boundaries
        run: |
          AGENTIC_CONTEXT_PYTHON="$(command -v python)" ./scripts/test.sh \
            tests/test_compact_wechat_sqlite.py::test_filesystem_compression_keeps_sqlite_content_and_reduces_actual_allocation \
            tests/test_publish_wechat_compaction.py::test_native_atomic_swap_and_reverse_preserve_both_original_inode_identities \
            tests/test_macos_applescript.py::test_native_worker_reuses_process_and_preserves_scalar_unicode_and_large_results \
            tests/test_macos_applescript.py::test_native_worker_preserves_error_number_and_resets_script_state \
            tests/test_macos_applescript.py::test_native_worker_remains_prohibited_from_dock_and_activation \
            tests/test_scraper_and_browser_sessions.py::test_clone_browser_profile_continues_when_macos_blocks_local_state \
            tests/test_job_lock.py \
            tests/test_iphone_client.py tests/test_iphone_setup.py \
            tests/test_iphone_controller.py tests/test_iphone_service.py \
            tests/test_wechat_native_resource_extension.py::test_enabled_sender_resolution_uses_exact_dictionary \
            tests/test_wechat_native_resource_extension.py::test_enabled_sender_resolution_handles_mixed_payloads_and_exact_replay \
            tests/test_wechat_clone_preparation.py::test_native_preparation_sets_only_tracking_and_preserves_existing_flags \
            tests/test_wechat_clone_preparation.py::test_preparation_uses_a_readonly_nofollow_descriptor_and_closes_it \
            tests/test_wechat_clone_preparation.py::test_path_swap_cannot_redirect_descriptor_flags_to_a_protected_source \
            tests/test_tunnel_runtime.py::test_posix_recovery_stops_a_real_orphan_and_spares_a_lookalike \
            tests/test_tunnel_checks.py::test_runner_loss_is_unknown_after_restart_and_orphan_can_be_stopped \
            --junitxml=test-results/macos-native.xml

      - name: Install Playwright WebKit
        run: python -m playwright install webkit

      - name: Verify WebKit rendering and interaction in simulated viewports
        env:
          AGENTIC_CONTEXT_SMOKE_BROWSER: webkit
        run: |
          AGENTIC_CONTEXT_PYTHON="$(command -v python)" ./scripts/test.sh \
            tests/test_browser_engine_smoke.py -o junit_family=xunit1 \
            --junitxml=test-results/webkit-smoke.xml

      - name: Upload macOS and WebKit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-webkit-attempt-${{ github.run_attempt }}
          path: |
            test-results/macos-native.xml
            test-results/webkit-smoke.xml
          if-no-files-found: warn

  check:
    name: Python, JavaScript, and test checks
    if: always()
    needs: [check-shards, check-python314, check-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Require every Linux shard and compatibility profile
        run: |
          test "${{ needs.check-shards.result }}" = success
          test "${{ needs.check-python314.result }}" = success
          test "${{ needs.check-macos.result }}" = success

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download every Linux coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-coverage-linux-attempt-${{ github.run_attempt }}-shard-*
          path: test-results/shards

      - name: Verify complete branch coverage
        run: python scripts/quality_shards.py aggregate --artifacts test-results/shards --minimum 55 --shard-status "${{ needs.check-shards.result }}"

      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage-attempt-${{ github.run_attempt }}
          path: test-results/coverage.json
          if-no-files-found: warn

  check-windows:
    name: Windows quality gate
    if: always()
    needs: check-windows-shards
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Require every Windows shard
        shell: pwsh
        run: |
          if ("${{ needs.check-windows-shards.result }}" -ne "success") {
            throw "Every Windows quality shard must succeed."
          }

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download every Windows coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-coverage-windows-attempt-${{ github.run_attempt }}-shard-*
          path: test-results/shards

      - name: Verify complete branch coverage
        run: python scripts/quality_shards.py aggregate --artifacts test-results/shards --minimum 55 --shard-status "${{ needs.check-windows-shards.result }}"

      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage-windows-attempt-${{ github.run_attempt }}
          path: test-results/coverage.json
          if-no-files-found: warn
