# Code version: v1.2.2-codex.1
name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python, JavaScript, and test checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run the quality gate
        run: AGENTIC_CONTEXT_PYTHON="$(command -v python)" ./scripts/check.sh

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: test-results/coverage.json
          if-no-files-found: warn

  check-windows:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      AGENTIC_CONTEXT_TEST_REPORT_FAILURES: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check native Windows boundaries before browser tests
        shell: pwsh
        run: |
          $env:AGENTIC_CONTEXT_PYTHON = (Get-Command python).Source
          .\scripts\test.ps1 --tb=short --show-capture=no `
            tests/test_compute_jobs.py `
            tests/test_windows_anchored_delete.py `
            tests/test_windows_entrypoints.py `
            tests/test_chromium_profile_boundaries.py `
            tests/test_computer_use_agent.py `
            tests/test_agent_controller_hardening.py `
            tests/test_agent_profile_binding.py `
            tests/test_agent_source_cache.py `
            tests/test_scraper_and_browser_sessions.py `
            tests/test_agent_session_pool.py

      - name: Run the quality gate
        shell: pwsh
        run: |
          $env:AGENTIC_CONTEXT_PYTHON = (Get-Command python).Source
          .\scripts\check.ps1

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-windows
          path: test-results/coverage.json
          if-no-files-found: warn
