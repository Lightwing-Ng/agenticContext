# Code version: v1.5.0-codex.1
name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python, JavaScript, and test checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Run the quality gate
        run: AGENTIC_CONTEXT_PYTHON="$(command -v python)" ./scripts/check.sh

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage
          path: test-results/coverage.json
          if-no-files-found: warn

  check-windows:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TZ: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Verify the first Windows browser boundary
        shell: pwsh
        run: |
          $env:AGENTIC_CONTEXT_PYTHON = (Get-Command python).Source
          & $env:AGENTIC_CONTEXT_PYTHON -m pytest -vv -x --tb=short -p no:cacheprovider `
            "tests/test_agent_activity_e2e.py::test_sidebar_icons_share_provider_axis_without_moving_dock"

      - name: Run the quality gate
        shell: pwsh
        run: |
          $env:AGENTIC_CONTEXT_PYTHON = (Get-Command python).Source
          .\scripts\check.ps1

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage-windows
          path: test-results/coverage.json
          if-no-files-found: warn
