# Code version: v1.0.0-ci-probe.1
name: CI failure reproduction
on: push
permissions:
  contents: read
jobs:
  probe:
    name: Windows Python invocation proof
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify Windows entrypoints and coverage rejection
        run: python -m pytest tests/test_windows_entrypoints.py -q
