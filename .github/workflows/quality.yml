# Code version: v1.0.0-ci-probe.1
name: CI failure reproduction
on: push
permissions:
  contents: read
jobs:
  probe:
    name: Windows ${{ matrix.group }} diagnostics
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [unit, browser]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install browser
        run: python -m playwright install chromium
      - name: Collect Windows failure details
        shell: pwsh
        run: |
          if ("${{ matrix.group }}" -eq "unit") {
            python -m pytest tests -q -m "not live" --tb=short --junitxml=test-results/windows-diagnostic.xml --ignore=tests/test_sidebar_e2e.py --ignore=tests/test_agent_activity_e2e.py --ignore=tests/test_style_alignment_e2e.py
          } else {
            python -m pytest tests/test_sidebar_e2e.py tests/test_agent_activity_e2e.py tests/test_style_alignment_e2e.py -q -m "not live" --tb=short --junitxml=test-results/windows-diagnostic.xml
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-diagnostic-${{ matrix.group }}
          path: test-results/windows-diagnostic.xml
